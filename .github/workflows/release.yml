name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Set build metadata
        id: build_meta
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push to a staging-only ref, never advertised to users, and gate exactly this
      # digest below. `publish` promotes it with `imagetools create` — never a second
      # build — so the bits Trivy scanned here are provably the bits that ship.
      - name: Build and push to staging (both arches, one multi-arch manifest)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:staging-${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
            REVISION=${{ github.sha }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64

      - name: Verify and smoke test (amd64)
        run: |
          image="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          scripts/verify-versions.sh "$image"
          scripts/smoke-test.sh "$image"

      - name: cbox CLI checks (bats, amd64)
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          IMAGE="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}" \
            /tmp/bats-core/bin/bats tests/test-cbox.bats

      - name: arm64 smoke check (under QEMU)
        run: |
          docker run --rm --platform linux/arm64 \
            "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}" claude --version

      - name: Trivy scan (fixable HIGH/CRITICAL blocks release)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore

  publish:
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # `latest` guarded against prereleases: `v0.0.1-rc1` (this workflow's own gate
      # criterion) must publish its semver tag without moving `latest` to an untested RC.
      - name: Docker metadata (semver + guarded latest, GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-tags the exact gated digest — imagetools does not rebuild or re-verify content.
      - name: Promote gated digest to release tags (GHCR)
        run: |
          tag_args=""
          while IFS= read -r t; do
            [ -n "$t" ] && tag_args="$tag_args --tag $t"
          done <<< "${{ steps.meta.outputs.tags }}"
          # shellcheck disable=SC2086
          docker buildx imagetools create $tag_args \
            "ghcr.io/${{ github.repository }}@${{ needs.gate.outputs.digest }}"

      - name: Assert published digest matches the gated digest
        run: |
          published="$(docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}" \
            --format '{{json .Manifest}}' | jq -r .digest)"
          if [ "$published" != "${{ needs.gate.outputs.digest }}" ]; then
            echo "error: published digest ($published) does not match gated digest (${{ needs.gate.outputs.digest }})" >&2
            exit 1
          fi
          echo "confirmed: published digest matches gated digest ($published)"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ needs.gate.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: sbom.cdx.json

      # Docker Hub: not wired up at launch — see plan.md / docs/build.md. Once
      # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets exist and this variable is set to
      # "true" in the repo's Actions settings, this step promotes the same gated digest
      # there too. Absent, it's skipped cleanly — it can never fail a release the way a
      # single combined push step (missing secrets, half-published to one registry) would.
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_ENABLED == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (semver + guarded latest, Docker Hub)
        if: ${{ vars.DOCKERHUB_ENABLED == 'true' }}
        id: meta_dockerhub
        uses: docker/metadata-action@v5
        with:
          images: docker.io/tungbq/claudebox
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Promote gated digest to release tags (Docker Hub)
        if: ${{ vars.DOCKERHUB_ENABLED == 'true' }}
        run: |
          tag_args=""
          while IFS= read -r t; do
            [ -n "$t" ] && tag_args="$tag_args --tag $t"
          done <<< "${{ steps.meta_dockerhub.outputs.tags }}"
          # shellcheck disable=SC2086
          docker buildx imagetools create $tag_args \
            "ghcr.io/${{ github.repository }}@${{ needs.gate.outputs.digest }}"
