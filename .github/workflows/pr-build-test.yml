name: PR build, test, scan

on:
  # No `paths:` filter here (unlike `push` below): main's branch protection requires
  # the `shellcheck` and `build-test-scan` job names to report on every PR, and a
  # workflow-level path filter means the workflow — and those required contexts — never
  # run at all for a PR that only touches paths outside the list, permanently blocking
  # merge. Each job instead checks paths itself (`Detect relevant path changes` below)
  # and no-ops when nothing relevant changed, so the required contexts always report.
  pull_request: {}
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/**
      - npm-lockfiles/**
      - cli/**
      - entrypoint.sh
      - tests/**
      - claudebox_info.json
      - .trivyignore
      - .github/workflows/pr-build-test.yml

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Detect relevant path changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)"
          echo "$changed"
          if echo "$changed" | grep -qE '^(Dockerfile|scripts/|npm-lockfiles/|cli/|entrypoint\.sh|tests/|claudebox_info\.json|\.trivyignore|\.github/workflows/pr-build-test\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: shellcheck cli/ and entrypoint.sh
        if: steps.changes.outputs.relevant == 'true'
        run: |
          shellcheck --shell=sh cli/cbox cli/cmd/*.sh scripts/lib/common.sh
          shellcheck entrypoint.sh scripts/bootstrap-config.sh scripts/install-*.sh \
            scripts/gen-lockfile.sh scripts/gen-version-table.sh \
            scripts/verify-versions.sh scripts/smoke-test.sh scripts/check-upstream-versions.sh

  build-test-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            arch_label: amd64
          - platform: linux/arm64
            arch_label: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Detect relevant path changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)"
          echo "$changed"
          if echo "$changed" | grep -qE '^(Dockerfile|scripts/|npm-lockfiles/|cli/|entrypoint\.sh|tests/|claudebox_info\.json|\.trivyignore|\.github/workflows/pr-build-test\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4
        if: steps.changes.outputs.relevant == 'true' && matrix.platform == 'linux/arm64'

      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.relevant == 'true'

      - name: Set build metadata
        id: meta
        if: steps.changes.outputs.relevant == 'true'
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build (no push)
        if: steps.changes.outputs.relevant == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: claudebox:dev
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch_label }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch_label }}

      - name: Base image checks
        if: steps.changes.outputs.relevant == 'true'
        run: |
          docker run --rm claudebox:dev id agent | grep -q 'uid=1000(agent) gid=1000(agent)'
          if docker run --rm claudebox:dev id ubuntu >/dev/null 2>&1; then
            echo "error: stock ubuntu user unexpectedly present" >&2
            exit 1
          fi
          docker run --rm claudebox:dev node --version | grep -q '^v22\.'
          docker run --rm claudebox:dev python3 --version | grep -q '^Python 3\.12'
          for bin in git gh rg fd jq yq gosu uv claude; do
            docker run --rm claudebox:dev which "$bin"
          done
          if docker run --rm claudebox:dev which sudo >/dev/null 2>&1; then
            echo "error: sudo unexpectedly present in image" >&2
            exit 1
          fi
          if docker run --rm claudebox:dev which gcc >/dev/null 2>&1; then
            echo "error: gcc unexpectedly present in image (build-essential should be cut)" >&2
            exit 1
          fi

      - name: Claude Code + version tooling checks
        if: steps.changes.outputs.relevant == 'true'
        run: |
          scripts/verify-versions.sh claudebox:dev
          scripts/smoke-test.sh claudebox:dev

      - name: cbox CLI checks (bats)
        if: steps.changes.outputs.relevant == 'true'
        run: |
          docker run --rm claudebox:dev cbox >/dev/null
          docker run --rm claudebox:dev claudebox >/dev/null
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          IMAGE=claudebox:dev /tmp/bats-core/bin/bats tests/test-cbox.bats

      # Reporting and gating are split into two Trivy runs on purpose. With `format: sarif`
      # the action builds the report with ALL severities — it drops the `severity` input in
      # that mode so the Security tab gets the complete picture. Pairing sarif output with
      # `exit-code: 1` therefore fails the job on every LOW/MEDIUM finding too, which no
      # .trivyignore curation can ever clear. This step is report-only (`exit-code: 0`);
      # the gate below does the blocking with `format: table`, where the HIGH/CRITICAL
      # filter actually applies — the same shape release.yml already uses.
      - name: Trivy report for the Security tab (all severities, never blocks)
        if: steps.changes.outputs.relevant == 'true' && vars.SKIP_TRIVY_SCAN != 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: claudebox:dev
          format: sarif
          output: trivy-results-${{ matrix.arch_label }}.sarif
          ignore-unfixed: true
          exit-code: 0
          trivyignores: .trivyignore

      # Code scanning uploads need a public repo or GitHub Advanced Security; on a private
      # repo without it this returns "Resource not accessible by integration". Losing the
      # Security tab report must not fail the build — the gate below is what blocks merges.
      - name: Upload Trivy results to the Security tab
        if: always() && steps.changes.outputs.relevant == 'true' && vars.SKIP_TRIVY_SCAN != 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results-${{ matrix.arch_label }}.sarif
          category: trivy-${{ matrix.arch_label }}

      # Repo variable escape hatch, default false (Settings > Secrets and variables >
      # Actions > Variables). Set SKIP_TRIVY_SCAN=true to unblock merges when the pinned
      # tool stack (gosu/yq/gh, see .trivyignore) is behind upstream CVE fixes and the
      # backlog can't be cleared quickly; set it back to false once a run is clean.
      #
      # Scope: this workflow runs on both `pull_request` and `push` to main, and the one
      # variable gates both — flipping it true stops scanning on main as well, it cannot
      # skip PRs only. Per-event control would need the condition to test
      # `github.event_name` (or a second variable) instead.
      - name: Trivy gate (fixable HIGH/CRITICAL blocks merge)
        if: steps.changes.outputs.relevant == 'true' && vars.SKIP_TRIVY_SCAN != 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: claudebox:dev
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore
